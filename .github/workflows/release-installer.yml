name: Release installer

# Builds the Windows installer (Tatty-Setup-<version>.exe) and attaches it to a GitHub
# release. Run it by hand, or push a tag such as v0.22.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Check the installer script
        shell: pwsh
        run: ./tools/test-installer.ps1

      - name: Build the installer
        shell: pwsh
        run: ./tools/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Tatty-Setup
          path: dist/Tatty-Setup-*.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist/Tatty-Setup-*.exe | Select-Object -First 1
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title "Tatty $env:GITHUB_REF_NAME" --generate-notes }
          gh release upload $env:GITHUB_REF_NAME $exe.FullName --clobber
